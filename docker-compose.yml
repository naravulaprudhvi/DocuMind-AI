version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: documind_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: documind_db
      MYSQL_USER: documind_user
      MYSQL_PASSWORD: documind_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  web:
    build: .
    container_name: documind_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: documind_user
      DB_PASSWORD: documind_secure_password
      DB_NAME: documind_db
      SECRET_KEY: production_super_secret_key_documind
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENABLE_QUERY_CACHE: "true"
      LLM_PROVIDER: "gemini"
    volumes:
      - ./uploads:/app/uploads
      - ./vector_indexes:/app/vector_indexes

volumes:
  mysql_data:
